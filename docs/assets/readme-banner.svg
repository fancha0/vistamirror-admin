      <rect x="526" y="251" width="148" height="36" rx="18" fill="#eae5ff"/><text x="600" y="274" fill="#765cbc">STRM 直连</text>
      <rect x="700" y="251" width="148" height="36" rx="18" fill="#e1f3f3"/><text x="774" y="274" fill="#3f858c">Docker 管理</text>
    </g>
